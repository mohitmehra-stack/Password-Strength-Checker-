<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>Password Strength</h1>
        <p class="sub"></p>
        <div class="wrap">
            <input type="password" id="pw" placeholder="Type your password"
            autocomplete="new-password"/>
            <button class="eye" id="eyeBtn" area-label="Toggle">
                <svg id="eyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stoke-linecap="round">
                     <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                     <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>

        <div class="bars">
            <div class="bar" id="b0"></div>
            <div class="bar" id="b1"></div>
            <div class="bar" id="b2"></div>
            <div class="bar" id="b3"></div>
            <div class="bar" id="b4"></div>
        </div>

        <div class="srow">
            <span id="lbl" style="color: var(--muted)">
                Enter a password
            </span>
            <span id="pct" style="color: var(--muted)">
            </span>
        </div>

        <div class="rules">
            <div class="rule" id="r0">
                <div class="dot"></div>
                8+ chars
            </div>
            <div class="rule" id="r1">
                <div class="dot"></div>
                Uppercase
            </div>
            <div class="rule" id="r2">
                <div class="dot"></div>
                Lowercase
            </div>
            <div class="rule" id="r3">
                <div class="dot"></div>
                Number
            </div>
            <div class="rule" id="r4">
                <div class="dot"></div>
                Symbol
            </div>
            <div class="rule" id="r5">
                <div class="dot"></div>
                12+ chars
            </div>
        </div>

        <div class="tip">
            <span id="tipIcon">💡</span>
            <span id="tipText">
                Start typing to get suggestions...
            </span>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
